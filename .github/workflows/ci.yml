name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-publishable-key
      TURNSTILE_SECRET_KEY: ci-turnstile-secret
      FRAUD_HASH_SALT: ci-fraud-hash-salt
      OAUTH_SIGNUP_PROOF_SECRET: ci-oauth-proof-secret
      SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
      OPENAI_API_KEY: ci-openai-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ci

  database-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start local Supabase
        run: npm run db:start
      - name: Check local Supabase type drift
        run: npm run db:reset && npm run db:types:local:check
      - name: Stop local Supabase
        if: always()
        run: node scripts/supabase-cli.mjs stop --no-backup

  remediation-local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-remediation-placeholder
      SUPABASE_SERVICE_ROLE_KEY: local-remediation-placeholder
      TURNSTILE_SECRET_KEY: ci-turnstile-secret
      FRAUD_HASH_SALT: ci-fraud-hash-salt
      OAUTH_SIGNUP_PROOF_SECRET: ci-oauth-proof-secret
      OPENAI_API_KEY: ci-openai-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Start local Supabase
        run: npm run db:start
      - name: Run local remediation acceptance gate
        run: npm run test:remediation:local
      - name: Stop local Supabase
        if: always()
        run: node scripts/supabase-cli.mjs stop --no-backup
