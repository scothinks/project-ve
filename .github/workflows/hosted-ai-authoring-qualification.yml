name: Hosted AI Authoring Qualification

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: Vercel app alias; probes resolve the exact immutable deployment
        required: true
        default: https://project-ve-git-codex-ai-course-work-ec78ce-oby-douglas-projects.vercel.app
        type: string
      git_ref:
        description: Git branch or ref recorded by the Vercel deployment
        required: true
        default: codex-ai-course-workflow-polish
        type: string
      expected_sha:
        description: Full Git commit SHA expected on the deployment
        required: true
        type: string
      evidence_path:
        description: Optional repository path to representative pilot evidence
        required: false
        default: ""
        type: string
      evidence_json:
        description: Optional non-secret pilot evidence JSON supplied at dispatch
        required: false
        default: ""
        type: string

permissions:
  contents: read
  deployments: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Preview
    env:
      HOSTED_APP_URL: ${{ inputs.app_url }}
      HOSTED_GIT_REF: ${{ inputs.git_ref }}
      HOSTED_EXPECTED_SHA: ${{ inputs.expected_sha }}
      HOSTED_EVIDENCE_PATH: ${{ inputs.evidence_path }}
      HOSTED_EVIDENCE_JSON: ${{ inputs.evidence_json }}
      GITHUB_TOKEN: ${{ github.token }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.HOSTED_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.HOSTED_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.expected_sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check deployable release contracts
        if: always()
        run: npm run test:release-readiness
      - name: Inspect hosted migration ledger and recovery boundary
        if: always()
        run: npm run test:release:migration:hosted -- --out artifacts/ai-authoring-hosted-migration.json
      - name: Qualify hosted identity, protection, worker boundary, and pilot follow-ups
        if: always()
        run: |
          arguments=(
            --app-url "$HOSTED_APP_URL"
            --repo "$GITHUB_REPOSITORY"
            --ref "$HOSTED_GIT_REF"
            --expected-sha "$HOSTED_EXPECTED_SHA"
            --out artifacts/ai-authoring-hosted-qualification.json
          )
          if [[ -n "$HOSTED_EVIDENCE_JSON" ]]; then
            evidence_file="$RUNNER_TEMP/ai-authoring-hosted-evidence.json"
            printf '%s\n' "$HOSTED_EVIDENCE_JSON" > "$evidence_file"
            arguments+=(--evidence "$evidence_file")
          elif [[ -n "$HOSTED_EVIDENCE_PATH" ]]; then
            arguments+=(--evidence "$HOSTED_EVIDENCE_PATH")
          fi
          node scripts/qualify-ai-authoring-hosted.mjs "${arguments[@]}"
      - name: Run read-only media cutover smoke
        if: always()
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Media cutover smoke is blocked: hosted Supabase inputs are incomplete."
            node -e 'require("node:fs").writeFileSync("artifacts/media-cutover-verify.json", JSON.stringify({status:"blocked",reason:"Set HOSTED_SUPABASE_URL, HOSTED_SUPABASE_PUBLISHABLE_KEY, SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF."}, null, 2) + "\n")'
            exit 1
          fi
          node scripts/media-cutover-verify.mjs \
            --app-url "$HOSTED_APP_URL" \
            --qualification-report artifacts/ai-authoring-hosted-qualification.json \
            --out artifacts/media-cutover-verify.json
      - name: Upload qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-authoring-hosted-qualification-${{ inputs.expected_sha }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 30
